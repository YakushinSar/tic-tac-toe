<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Крестики-нолики с ИИ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Крестики-нолики</h1>

    <div class="controls">
      <label for="difficulty">Уровень ИИ:</label>
      <select id="difficulty">
        <option value="easy">🧠 Лёгкий</option>
        <option value="hard" selected>🤖 Сложный</option>
      </select>
      <button class="reset-game" id="resetGame">🔄 Новая игра</button>
    </div>

    <div class="scoreboard">
      <div class="score x-score"><span class="symbol">X</span> <span id="xWins">0</span></div>
      <div class="score draws"><span>🤝</span> <span id="draws">0</span></div>
      <div class="score o-score"><span class="symbol">O</span> <span id="oWins">0</span></div>
    </div>

    <p class="status" id="status">Ход: <strong>X</strong></p>

    <div class="board" id="board"></div>

    <button class="reset-score" id="resetScore">🗑️ Сбросить счёт</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
